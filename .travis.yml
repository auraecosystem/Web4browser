language: generic

jobs:
  include:
    # Linux builds
    - os: linux
      arch: amd64
    - os: linux
      arch: arm64
    
    # macOS builds
    - os: osx
      osx_image: xcode12.5
    
    # Windows builds
    - os: windows

script:
  - echo "Running tests on $TRAVIS_OS_NAME $TRAVIS_CPU_ARCH"
  - # Add your build and test commands here

notifications:
  email: false
import:
  - travis-ci/build-configs:rubies.yml@adf1235
  - travis-ci/build-configs:other.yml@v1

# or

import:
  - source: travis-ci/build-configs:rubies.yml@adf1235
  - source: travis-ci/build-configs:other.yml@v1
